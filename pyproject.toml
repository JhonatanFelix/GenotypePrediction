[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[dependency-groups]
dev = [
    "pytest==8.2.2",
    "ruff>=0.15.12",
]
test = [
    "pytest==8.2.2",
]

[tool.pdm.scripts]
check = "python -m compileall src tests"
lint = "ruff check ."
format-check = "ruff format --check ."
test = "pytest"
ci = {composite = ["check", "test", "lint", "format-check"]}

[tool.pdm.resolution.overrides]
attrs = "==23.2.0"
distlib = "==0.3.8"
filelock = "==3.15.1"
iniconfig = "==2.0.0"
jsonschema = "==4.22.0"
jsonschema-specifications = "==2023.12.1"
joblib = "==1.4.2"
packaging = "==24.1"
platformdirs = "==4.2.2"
pluggy = "==1.5.0"
python-dateutil = "==2.9.0.post0"
pytz = "==2024.1"
pyyaml = "==6.0.2"
referencing = "==0.35.1"
rpds-py = "==0.18.1"
six = "==1.16.0"
tzdata = "==2024.1"
virtualenv = "==20.26.2"
threadpoolctl = "==3.5.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
