[project]
name = "GenotypePrediction"
version = "0.1.0"
description = "Python reproductions of classical genotype prediction methods."
authors = [
    {name = "jhonatan", email = "jhonyrf@gmail.com"},
]
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scikit-learn==1.6.1",
    "scipy==1.13.1",
]
requires-python = ">=3.12.3,<3.13"
readme = "README.md"
license = {text = "MIT"}

