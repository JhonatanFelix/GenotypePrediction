[project]
name = "GenotypePrediction"
version = "0.1.0"
description = "Python reproductions of classical genotype prediction methods."
authors = [
    {name = "jhonatan", email = "jhonyrf@gmail.com"},
]
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.15",
]
requires-python = ">=3.12.3,<3.14"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pdm.scripts]
check = "python -m compileall src tests"
lint = "ruff check ."
format-check = "ruff format --check ."
test = "pytest"
ci = {composite = ["check", "test", "lint", "format-check"]}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
